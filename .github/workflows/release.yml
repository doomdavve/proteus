name: Release Wake Velocity

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/macos-boat.yml

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/windows-boat.yml

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check release publisher without network
        run: |
          python3 tools/test_publish_release.py
          python3 tools/test_cut_release.py

      - uses: actions/download-artifact@v4
        with:
          name: wake_velocity-${{ github.ref_name }}-macos-arm64
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: wake_velocity-${{ github.ref_name }}-windows-x64
          path: windows-package/wake_velocity-${{ github.ref_name }}-windows-x64

      - name: Create Windows release archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd windows-package
          package="wake_velocity-${RELEASE_TAG}-windows-x64"
          zip -r "../release-assets/${package}.zip" "$package"
          cd ../release-assets
          sha256sum "${package}.zip" > "${package}.zip.sha256"
          sha256sum -c "${package}.zip.sha256"
          sha256sum -c "wake_velocity-${RELEASE_TAG}-macos-arm64.zip.sha256"

      - name: Publish release with both apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/publish_release.sh "$RELEASE_TAG" release-assets
