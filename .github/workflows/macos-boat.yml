name: macOS Wake Velocity

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/README.txt'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/README.txt'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel obsolete PR runs without interrupting main or release qualification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    env:
      PROTEUS_QUALIFY: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
      PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 30 || 3 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check release publisher without network
        if: env.PROTEUS_QUALIFY == 'true'
        run: python3 tests/tools/test_publish_release.py

      - name: Configure Apple Silicon Release
        run: >-
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DPROTEUS_GPU_TESTS=OFF

      - name: Build routine CI targets
        if: env.PROTEUS_QUALIFY != 'true'
        run: cmake --build build-mac --target ci --parallel 3

      - name: Run bounded PR checks
        if: env.PROTEUS_QUALIFY != 'true'
        timeout-minutes: 1
        run: >-
          ctest --test-dir build-mac -L '^ci$' --parallel 2 --timeout 10
          --stop-on-failure --no-tests=error --output-on-failure
          --output-junit ci-results.xml

      - name: Build and test
        if: env.PROTEUS_QUALIFY == 'true'
        run: |
          cmake --build build-mac --parallel 3
          ctest --test-dir build-mac --output-on-failure

      - name: Package and ad-hoc sign
        if: env.PROTEUS_QUALIFY == 'true'
        run: python3 tools/macos/package.py --build-dir build-mac --output-dir build-mac/package --version "$PACKAGE_VERSION"

      - name: Check extracted app outside the checkout
        if: env.PROTEUS_QUALIFY == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/relocated"
          ditto -x -k "build-mac/package/wake_velocity-${PACKAGE_VERSION}-macos-arm64.zip" "$RUNNER_TEMP/relocated"
          app="$RUNNER_TEMP/relocated/Wake Velocity.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          cd "$RUNNER_TEMP"
          "$app/Contents/MacOS/wake_velocity" --renderer cpu --location outer --time 3 --screenshot relocated.png
          test -s relocated.png
          "$app/Contents/MacOS/wake_velocity" --serve --scripted --ticks 240
          test -s "$app/Contents/Resources/assets/music/a-little-boat.xm"
          test -s "$app/Contents/Resources/assets/geometry/river/scenery.bin"
          test -s "$app/Contents/Resources/assets/geometry/outer/scenery.bin"
          test -s "$app/Contents/Resources/assets/shaders/waterfront_city.fs"
          test -s "$app/Contents/Resources/assets/title/river-backdrop.png"
          test -s "$app/Contents/Resources/assets/title/wake-velocity.png"
          test -s "$app/Contents/Resources/assets/fonts/m5x7.fnt"
          test -s "$app/Contents/Resources/assets/fonts/m3x6.fnt"
          test -s "$app/Contents/Resources/assets/fonts/m5x7.png"
          test -s "$app/Contents/Resources/assets/fonts/m3x6.png"
          # Packaged authoring tools find their worker and game through plugin_tools.json.
          author="$app/Contents/Resources/authoring/plugin_author.py"
          cp -R "$app/Contents/Resources/assets/plugins/shelter-tour" mine
          python3 "$author" validate mine
          python3 "$author" preview mine
          python3 "$author" capture mine --anchor outer.dock --time 0 --output plugin-frame.png
          test -s plugin-frame.png
          # Running the tools must leave the signed bundle untouched.
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Upload downloadable app
        if: env.PROTEUS_QUALIFY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wake_velocity-${{ env.PACKAGE_VERSION }}-macos-arm64
          path: |
            build-mac/package/*.zip
            build-mac/package/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload failing routine CI test results
        if: failure() && env.PROTEUS_QUALIFY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-boat-ci-results
          path: build-*/ci-results.xml
          if-no-files-found: ignore
          retention-days: 7
