name: Windows Wake Velocity

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/README.txt'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/README.txt'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel obsolete PR runs without interrupting main or release qualification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    env:
      PROTEUS_VCPKG_TRIPLET: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'x64-windows-static' || 'x64-windows-static-release' }}
      PROTEUS_QUALIFY: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
      PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 20 || 3 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Identify vcpkg cache
        id: vcpkg-key
        run: |
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tripletHash = (Get-FileHash cmake/triplets/x64-windows-static-release.cmake).Hash
          "key=windows-2022-vcpkg-v1-$env:ImageVersion-$revision-$env:PROTEUS_VCPKG_TRIPLET-$tripletHash" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/proteus-vcpkg-cache
          key: ${{ steps.vcpkg-key.outputs.key }}

      - name: Install static libcurl
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/proteus-vcpkg-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/proteus-vcpkg-cache" | Out-Null
          vcpkg install "curl[ssl]:$env:PROTEUS_VCPKG_TRIPLET" --overlay-triplets=cmake/triplets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg binary packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/proteus-vcpkg-cache
          key: ${{ steps.vcpkg-key.outputs.key }}

      - name: Configure release with static raylib and C runtime
        if: env.PROTEUS_QUALIFY == 'true'
        run: >-
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64
          -DBUILD_SHARED_LIBS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="$env:PROTEUS_VCPKG_TRIPLET"
          -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/cmake/triplets"

      - name: Set up MSVC for Ninja
        if: env.PROTEUS_QUALIFY != 'true'
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC installation not found' }
          & "$installation/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not $value) { throw "MSVC environment is missing $name" }
            "$name=$value" >> $env:GITHUB_ENV
          }

      - name: Configure routine Release with Ninja and MSVC
        if: env.PROTEUS_QUALIFY != 'true'
        run: >-
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl
          -DBUILD_SHARED_LIBS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="$env:PROTEUS_VCPKG_TRIPLET"
          -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/cmake/triplets"

      - name: Build routine CI targets
        if: env.PROTEUS_QUALIFY != 'true'
        run: cmake --build build-win --config Release --target ci --parallel 4

      - name: Run bounded PR checks
        if: env.PROTEUS_QUALIFY != 'true'
        timeout-minutes: 1
        run: >-
          ctest --test-dir build-win -C Release -L '^ci$' --parallel 2 --timeout 10
          --stop-on-failure --no-tests=error --output-on-failure
          --output-junit ci-results.xml

      - name: Build Wake Velocity, room server and validators
        if: env.PROTEUS_QUALIFY == 'true'
        run: |
          $targets = 'wake_velocity', 'boat_server', 'boat_bot', 'validate_boat', 'validate_boat_net', 'validate_boat_local', 'validate_boat_directory', 'validate_boat_plugin', 'validate_boat_plugin_session', 'validate_boat_plugin_state', 'boat_plugin_worker', 'validate_boat_plugin_stage', 'validate_boat_plugin_eval', 'validate_wake_bridge', 'validate_boat_plugin_race', 'validate_boat_race_plugin', 'boat_race_trial', 'boat_plugin_bench', 'boat_water_review'
          cmake --build build-win --config Release --target $targets --parallel 2>&1 |
            Tee-Object -FilePath build-win/build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-win/build.log |
              Where-Object { $_ -match '\berror\b|fatal' } |
              ForEach-Object {
                $message = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error::$message"
              }
            exit 1
          }

      - name: Run boat CPU and multiplayer checks
        if: env.PROTEUS_QUALIFY == 'true'
        run: >-
          ctest --test-dir build-win -C Release --output-on-failure
          -R '^(boat_handling\..*|boat_screenshot|boat_river_screenshot|boat_server_scripted|wake_velocity_serve_scripted|boat_local\..*|boat_net\..*|boat_net_enet\..*|boat_net_process|boat_host|boat_directory|boat_plugin_author|boat_plugin_capture|boat_plugin_stage|boat_plugin_eval|wake_velocity_bridge|boat_plugin\..*|boat_plugin_session\..*|boat_plugin_state\..*|boat_plugin_race\..*|boat_race_plugin\..*|boat_race_plugin_preview|wake_velocity_plugin_.*)$'

      - name: Record native plugin staging and callback costs
        if: env.PROTEUS_QUALIFY == 'true'
        run: |
          $bench = & ./build-win/Release/boat_plugin_bench.exe plugins/shelter-tour
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bench
          @('### Windows plugin costs (boat_plugin_bench, shelter-tour)', '```') + $bench + '```' |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Package portable Wake Velocity
        if: env.PROTEUS_QUALIFY == 'true'
        run: |
          $package = "build-win/package/wake_velocity-$env:PACKAGE_VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path "$package/assets" | Out-Null
          Copy-Item build-win/Release/wake_velocity.exe "$package/wake_velocity.exe"
          Copy-Item build-win/Release/assets/shaders "$package/assets" -Recurse
          Copy-Item build-win/Release/assets/textures "$package/assets" -Recurse
          Copy-Item build-win/Release/assets/title "$package/assets" -Recurse
          Copy-Item build-win/Release/assets/fonts "$package/assets" -Recurse
          New-Item -ItemType Directory -Force -Path "$package/assets/music" | Out-Null
          Copy-Item build-win/Release/assets/music/a-little-boat.xm "$package/assets/music"
          foreach ($map in "river", "outer") {
            New-Item -ItemType Directory -Force -Path "$package/assets/geometry/$map" | Out-Null
            Copy-Item "assets/geometry/$map/manifest.json" "$package/assets/geometry/$map"
            Copy-Item "assets/geometry/$map/scenery.bin" "$package/assets/geometry/$map"
          }
          # Reference Lua plugins (--plugin assets/plugins/langedrag, copied to edit) and the
          # authoring tools with their isolated validator beside the game.
          python tools/package_plugin_tools.py --authoring "$package/authoring" `
            --worker build-win/Release/boat_plugin_worker.exe `
            --worker-path "$package/boat_plugin_worker.exe" `
            --game-path "$package/wake_velocity.exe" --plugins "$package/assets/plugins" `
            --package windows-x64 --version $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Plugin tools packaging failed: $LASTEXITCODE" }
          Copy-Item tools/windows/launch.bat $package
          Copy-Item tools/windows/host.bat $package
          Copy-Item tools/windows/collect-performance.bat $package
          Copy-Item build-win/Release/boat_water_review.exe $package
          Copy-Item tools/windows/README.txt $package
          Copy-Item build-win/_deps/raylib-src/LICENSE "$package/raylib-LICENSE.txt"
          Copy-Item build-win/_deps/raylib-src/src/external/glfw/LICENSE.md "$package/glfw-LICENSE.md"
          Copy-Item build-win/_deps/enet-src/LICENSE "$package/enet-LICENSE.txt"
          Copy-Item third_party/jsmn/LICENSE "$package/jsmn-LICENSE.txt"
          Copy-Item build-win/lua-LICENSE.txt "$package/lua-LICENSE.txt"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/share/curl/copyright" "$package/curl-LICENSE.txt"
          Set-Content -Path "$package/build.txt" -Value "Version: $env:PACKAGE_VERSION`nCommit: $env:GITHUB_SHA" -Encoding utf8

      - name: Check relocated executable from another working directory
        if: env.PROTEUS_QUALIFY == 'true'
        run: |
          $exe = (Resolve-Path "build-win/package/wake_velocity-$env:PACKAGE_VERSION-windows-x64/wake_velocity.exe").Path
          Push-Location $env:RUNNER_TEMP
          try {
            & $exe --renderer cpu --location outer --time 3 --screenshot boat-portable.png
            if ($LASTEXITCODE -ne 0) { throw "Relocated Wake Velocity failed: $LASTEXITCODE" }
            $plugin = Join-Path (Split-Path $exe) assets/plugins/langedrag
            & $exe --renderer cpu --plugin $plugin --time 3 --screenshot boat-plugin.png
            if ($LASTEXITCODE -ne 0) { throw "Packaged voyage plugin failed: $LASTEXITCODE" }
            # Packaged authoring tools find their worker and game through plugin_tools.json.
            $author = Join-Path (Split-Path $exe) authoring/plugin_author.py
            Copy-Item $plugin mine -Recurse -Force
            foreach ($operation in @('validate', 'preview')) {
              python $author $operation mine
              if ($LASTEXITCODE -ne 0) { throw "Packaged plugin $operation failed: $LASTEXITCODE" }
            }
            python $author capture mine --anchor outer.dock --time 0 --output plugin-frame.png
            if ($LASTEXITCODE -ne 0) { throw "Packaged plugin capture failed: $LASTEXITCODE" }
            & $exe --serve --scripted --ticks 240
            if ($LASTEXITCODE -ne 0) { throw "Relocated boat server failed: $LASTEXITCODE" }
            # G0w packaging evidence: the graphics review fixture is CPU-only and must run from
            # the relocated package; a software-rendered CI benchmark is not a GPU baseline.
            $review = Join-Path (Split-Path $exe) boat_water_review.exe
            $state = & $review --stress-state
            if ($LASTEXITCODE -ne 0) { throw "Relocated stress fixture failed: $LASTEXITCODE" }
            if (($state -join "`n") -notmatch 'wake_live=128') { throw "Stress fixture did not saturate its wake pool" }
            & $review --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Relocated review help failed: $LASTEXITCODE" }
            $launcher = Join-Path (Split-Path $exe) collect-performance.bat
            if (-not (Test-Path $launcher -PathType Leaf)) { throw "Performance launcher is missing" }
            # The Mac analyzer is stdlib-only; validate it on the same synthetic fixture here.
            python "$env:GITHUB_WORKSPACE/tools/compare_performance_reports.py" "$env:GITHUB_WORKSPACE/tools/fixtures/performance/candidate" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Performance analyzer failed: $LASTEXITCODE" }
            foreach ($fontAsset in @("m5x7.fnt", "m5x7.png", "m3x6.fnt", "m3x6.png")) {
              $fontPath = Join-Path (Split-Path $exe) "assets/fonts/$fontAsset"
              if (-not (Test-Path $fontPath -PathType Leaf)) {
                throw "Packaged menu font is missing: $fontPath"
              }
            }
            $wordmark = Join-Path (Split-Path $exe) assets/title/wake-velocity.png
            if (-not (Test-Path $wordmark -PathType Leaf)) {
              throw "Packaged title wordmark is missing: $wordmark"
            }
            $backdrop = Join-Path (Split-Path $exe) assets/title/river-backdrop.png
            if (-not (Test-Path $backdrop -PathType Leaf)) {
              throw "Packaged title backdrop is missing: $backdrop"
            }
          } finally {
            Pop-Location
          }

      - name: Upload Windows package
        if: env.PROTEUS_QUALIFY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wake_velocity-${{ env.PACKAGE_VERSION }}-windows-x64
          path: build-win/package/wake_velocity-${{ env.PACKAGE_VERSION }}-windows-x64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failing routine CI test results
        if: failure() && env.PROTEUS_QUALIFY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-boat-ci-results
          path: build-*/ci-results.xml
          if-no-files-found: ignore
          retention-days: 7
