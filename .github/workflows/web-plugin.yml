name: Browser plugin authoring

on:
  pull_request:
    paths:
      - 'web/**'
      - 'cmake/Web.cmake'
      - 'src/boat_plugin*'
      - 'tools/*plugin*'
      - 'tools/package_web.py'
      - 'CMakeLists.txt'
      - '.github/workflows/web-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check browser authoring contracts
        run: node tools/test_web_plugin_author.cjs
      - name: Check out official Emscripten SDK
        uses: actions/checkout@v6
        with:
          repository: emscripten-core/emsdk
          ref: 3b3963d86a5c97adaf6eaa845cdfe0b811c2f960
          path: .emsdk
          persist-credentials: false
      - name: Build packaged game and isolated descriptor worker
        shell: bash
        run: |
          version=$(cat web/emsdk-version)
          .emsdk/emsdk install "$version"
          .emsdk/emsdk activate "$version"
          source .emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build-web --target web --parallel 2
          test -s build-web/site/index.html
          test -s build-web/site/lua-LICENSE.txt
      - name: Install Playwright browser engines
        run: |
          python3 -m venv .playwright
          .playwright/bin/pip install playwright==1.64.1
          .playwright/bin/playwright install --with-deps chromium firefox webkit
      - name: Qualify browser authoring on Chromium, Firefox and WebKit
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory build-web/site &
          for _ in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:8000/ && break; sleep 0.2; done
          for engine in chromium firefox webkit; do
            .playwright/bin/python tools/check_web_plugin_author.py --browser "$engine" \
              --url http://127.0.0.1:8000/ --output "build-web/plugin-browser-check/$engine"
          done
      - name: Upload browser authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-plugin-browser-check
          path: build-web/plugin-browser-check
          if-no-files-found: ignore
